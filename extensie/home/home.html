<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="pageTitle">Start</title>
  <link rel="stylesheet" href="home.css">
  <script src="home.js" defer></script>
</head>
<body>
  <div id="bg" aria-hidden="true"></div>

  <main id="widget" aria-live="polite">
    <div id="time">--:--</div>
    <div id="date"></div>
    <div id="weather">
      <span id="wicon" aria-hidden="true"></span>
      <span id="wtemp"></span>
      <span id="wdesc"></span>
    </div>
    <div id="wmeta">
      <button id="city" type="button" data-i18n-title="changeCity" title="Schimbă orașul">București</button>
      <span id="wrange"></span>
    </div>
    <ul id="forecast" data-i18n-aria-label="forecast3" aria-label="Prognoza pe 3 zile"></ul>

    <section id="mail" hidden aria-labelledby="mailCount">
      <h2 id="mailCount"></h2>
      <ul id="mailList"></ul>
    </section>
  </main>

  <button id="settingsBtn" type="button" data-i18n-title="bgSettings" data-i18n-aria-label="bgSettings" title="Setări fundal" aria-label="Setări fundal" aria-expanded="false">&#9881;</button>

  <form id="settings" hidden>
    <h2 data-i18n="bgSettings">Setări fundal</h2>
    <label for="cityInput" data-i18n="cityLabel">Oraș pentru vreme</label>
    <input id="cityInput" autocomplete="off" data-i18n-placeholder="cityPlaceholder" placeholder="ex. București">
    <p id="cityMsg" class="msg" role="status"></p>

    <label for="bgSource" data-i18n="bgLabel">Fundal</label>
    <select id="bgSource">
      <option value="thunderbird" data-i18n="bgThunderbird">Ilustrația Thunderbird</option>
      <option value="wallhaven" data-i18n="bgWallhaven">Wallhaven (fără cont, doar imagini SFW)</option>
    </select>
    <label for="photoTopic"><span data-i18n="topicLabel">Tema fotografiilor</span> <span class="hint" data-i18n="topicHint">(în engleză)</span></label>
    <input id="photoTopic" autocomplete="off" data-i18n-placeholder="topicPlaceholder" placeholder="ex. mountains, nature, city night">
    <p id="photoMsg" class="msg" role="status"></p>

    <label for="langSelect" data-i18n="langLabel">Limba</label>
    <select id="langSelect">
      <option value="auto" data-i18n="langAuto">Automat (limba Thunderbird)</option>
      <option value="ro">Română</option>
      <option value="en">English</option>
    </select>

    <div class="row">
      <button type="submit" class="primary" data-i18n="save">Salvează</button>
      <button type="button" id="newPhoto" data-i18n="newPhoto">Fotografie nouă</button>
      <button type="button" id="closeSettings" data-i18n="close">Închide</button>
    </div>
  </form>

  <p id="credit"></p>
</body>
</html>
